<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股量化雷達 Demo</title>
<style>body{background:#101827;color:#e8eef8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px}h1{font-size:23px}small,.hint{color:#a8b7ca}.card{background:#1b293d;border:1px solid #33445c;border-radius:15px;padding:16px;margin:14px 0}button,input,select{font:inherit;border-radius:9px;padding:10px;margin:4px 0}button{background:#4779e8;color:white;border:0}input,select{background:#101827;color:white;border:1px solid #60718a;max-width:100%;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tile{border:0;border-radius:8px;color:white;min-width:90px;flex:1;padding:14px;text-align:left}.up{background:#9b3443}.down{background:#267f61}.flat{background:#526178}#tiles{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:8px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 4px;border-bottom:1px solid #34445b;text-align:left} .badge{color:#ffd07b}</style>
<h1>📊 台股量化雷達 <small>v0.1</small></h1><p class="badge">⚠️ 教學模擬資料，非即時行情，請勿據此交易。</p>
<div class="card"><h3>🔥 資金熱力圖（模擬）</h3><div id="tiles"></div><p class="hint">方塊顏色代表漲跌，文字顯示模擬成交金額。</p><button id="refresh">更新模擬盤勢</button></div>
<div class="card"><h3>🧩 建立選股策略</h3><label>策略名稱 <input id="name" placeholder="例如：超跌反彈" value="超跌反彈"></label>
<label>條件組合 <select id="mode"><option value="AND">全部符合 AND</option><option value="OR">任一符合 OR</option></select></label>
<label>布林條件 <select id="bb"><option value="none">不使用</option><option value="below">股價低於布林下軌</option><option value="above">股價高於布林上軌</option><option value="middle">股價高於布林中軌</option></select></label>
<label>RSI 週期 <select id="period"><option value="6">6</option><option value="14">14</option></select></label>
<div class="row"><select id="op"><option value="lt">RSI 小於</option><option value="gt">RSI 大於</option></select><input id="threshold" type="number" min="0" max="100" value="20" aria-label="RSI 門檻"></div>
<div class="row"><button id="save">💾 儲存策略</button><button id="scan">🔎 執行掃描</button></div><p id="msg" class="hint" aria-live="polite"></p>
<h4>已儲存策略</h4><div id="saved"></div></div>
<div class="card"><h3>📋 掃描結果</h3><div id="results">按「執行掃描」開始。</div></div>
<script>
const stocks=[{id:'2330',name:'台積電',price:1000},{id:'2317',name:'鴻海',price:210},{id:'2454',name:'聯發科',price:1300},{id:'2303',name:'聯電',price:48},{id:'2603',name:'長榮',price:185},{id:'2881',name:'富邦金',price:90},{id:'2382',name:'廣達',price:275},{id:'3037',name:'欣興',price:160}];
let strategies=[];try{strategies=JSON.parse(localStorage.getItem('twStrategies')||'[]');if(!Array.isArray(strategies))strategies=[]}catch{strategies=[]}
const $=id=>document.getElementById(id);function generate(){stocks.forEach(s=>{s.change=Math.round((Math.random()-.5)*120)/10;s.amount=Math.round(20+Math.random()*800);s.mid=s.price*(.97+Math.random()*.06);s.upper=s.mid*1.06;s.lower=s.mid*.94;s.rsi6=Math.round(Math.random()*100);s.rsi14=Math.round(Math.random()*100)});$('tiles').innerHTML=stocks.map(s=>`<div class="tile ${s.change>0?'up':s.change<0?'down':'flat'}"><strong>${s.id} ${s.name}</strong><br>${s.change>0?'+':''}${s.change}%<br><small>成交 ${s.amount} 百萬</small></div>`).join('')}
function current(){return{name:$('name').value.trim().slice(0,40),mode:$('mode').value,bb:$('bb').value,period:$('period').value,op:$('op').value,threshold:Number($('threshold').value)}}
function valid(s){return s.name&&Number.isFinite(s.threshold)&&s.threshold>=0&&s.threshold<=100}
function persist(){try{localStorage.setItem('twStrategies',JSON.stringify(strategies))}catch{$('msg').textContent='此瀏覽器無法永久儲存，請勿依賴保存。'}renderSaved()}
function renderSaved(){$('saved').innerHTML='';strategies.forEach((s,i)=>{const d=document.createElement('div');d.className='row';const label=document.createElement('span');label.textContent=s.name+'（'+s.mode+'）';const load=document.createElement('button');load.textContent='載入';load.addEventListener('click',()=>{['name','mode','bb','period','op','threshold'].forEach(k=>$(k).value=s[k]);$('msg').textContent='已載入 '+s.name});const del=document.createElement('button');del.textContent='刪除';del.addEventListener('click',()=>{strategies.splice(i,1);persist()});d.append(label,load,del);$('saved').append(d)})}
$('save').addEventListener('click',()=>{const s=current();if(!valid(s)){ $('msg').textContent='請輸入策略名稱及 0–100 的 RSI 門檻';return}const i=strategies.findIndex(x=>x.name===s.name);if(i>=0)strategies[i]=s;else strategies.push(s);persist();$('msg').textContent='策略已儲存於此瀏覽器（同名覆蓋）'});
$('scan').addEventListener('click',()=>{const s=current();if(!valid(s)){$('msg').textContent='請先輸入有效條件';return}const found=stocks.filter(x=>{const b=s.bb==='none'?null:s.bb==='below'?x.price<x.lower:s.bb==='above'?x.price>x.upper:x.price>x.mid;const r=s.op==='lt'?x['rsi'+s.period]<s.threshold:x['rsi'+s.period]>s.threshold;return b===null?r:s.mode==='AND'?b&&r:b||r});$('results').innerHTML=found.length?'<table><tr><th>股票</th><th>RSI('+s.period+')</th><th>模擬漲跌</th></tr>'+found.map(x=>`<tr><td>${x.id} ${x.name}</td><td>${x['rsi'+s.period]}</td><td>${x.change}%</td></tr>`).join('')+'</table>':'目前模擬資料無符合股票';$('msg').textContent='已用 '+s.mode+' 掃描 '+stocks.length+' 檔示範股票'});
$('refresh').addEventListener('click',()=>{generate();$('results').textContent='模擬資料已更新，請重新掃描。'});generate();renderSaved();
</script></html>
