name: Backfill All TWSE Stock History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twse-history-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backfill stock history
        run: python scripts/backfill_all.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_history/
          if git diff --cached --quiet; then
            echo "沒有新的歷史資料需要提交"
          else
            git commit -m "Backfill TWSE stock history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
