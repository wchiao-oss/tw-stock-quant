
name: Update Institutional Chip Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: twse-chip-write
  cancel-in-progress: false

jobs:
  update-chip:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update institutional data
        run: python scripts/update_chip.py

      - name: Commit chip data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chip_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update institutional chip data"
            git push
          fi
