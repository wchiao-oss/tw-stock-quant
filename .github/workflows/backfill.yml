name: Backfill TWSE Stock History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download historical stock prices
        run: python scripts/backfill.py

      - name: Commit historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock_history/

          if git diff --cached --quiet; then
            echo "No new historical data"
          else
            git commit -m "Backfill historical stock prices"
            git push
          fi
