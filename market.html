<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股量化雷達｜上市真實收盤行情</title><style>body{font:16px system-ui;background:#101827;color:#f2f5fc;margin:20px}input{padding:12px;width:90%;max-width:380px;border-radius:10px;border:0}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{padding:9px 5px;border-bottom:1px solid #344052;text-align:left}small{color:#adb9cf}.up{color:#ff8585}.down{color:#7bd5b5}</style><h2>📊 台股量化雷達｜上市收盤行情</h2><p id="status">載入資料中…</p><input id="q" placeholder="搜尋代號或名稱（如 2330）"><div style="overflow-x:auto"><table><thead><tr><th>代號</th><th>名稱</th><th>收盤</th><th>漲跌</th><th>成交值(億)</th></tr></thead><tbody id="rows"></tbody></table></div><script>let stocks=[];const fmt=n=>n==null?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});function draw(){let q=document.getElementById('q').value.trim();document.getElementById('rows').innerHTML=stocks.filter(x=>x.code.includes(q)||x.name.includes(q)).slice(0,100).map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${fmt(x.close)}</td><td class="${x.change>0?'up':x.change<0?'down':''}">${fmt(x.change)}</td><td>${fmt(x.turnover_twd/1e8)}</td></tr>`).join('')}document.getElementById('q').oninput=draw;fetch('./data/latest.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('尚未產生行情資料');return r.json()}).then(d=>{stocks=d.stocks;document.getElementById('status').textContent=`來源：證交所官方盤後資料｜資料交易日：${stocks[0]?.date||'未知'}｜更新擷取：${d.fetched_at_utc}｜上市 ${stocks.length} 筆（非即時）`;draw()}).catch(e=>document.getElementById('status').textContent='尚無資料：請先在 GitHub Actions 手動執行 Update TWSE daily prices。'+e.message)</script></html>
